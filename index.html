<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><title>SERPENT · Arena</title><link rel="stylesheet" href="src/styles.css"></head>
<body><main id="app"><canvas id="game" aria-label="Игровая арена. Управление мышью, WASD или джойстиком"></canvas>
<div id="hud"><div class="hud-score"><b id="score"></b><div class="bar"><i id="progress"></i></div><span id="target"></span></div><div class="corner-mark">S<span> / </span>ARENA</div></div>
<div id="controls"><button id="country" title="Изменить скин" aria-label="Изменить скин"></button><div id="joystick" aria-label="Виртуальный джойстик"><div id="stick"></div></div><button id="boost" aria-label="Ускорение">↟<small>BOOST</small></button></div>
<div class="top-actions"><button id="pauseBtn" aria-label="Пауза">Ⅱ</button><button id="adminBtn" aria-label="Настройки">⚙</button></div><div id="toast" role="status"></div>
<div id="menu" class="overlay"><section class="menu-card"><div class="eyebrow">A WORLD THAT NEVER STANDS STILL</div><h1>SERPENT<span>ARENA</span></h1><p>Собирай золото. Расти. Обойди соперников.</p><div id="menuSkins" class="menu-skins"></div><button id="play" class="primary">НАЧАТЬ ИГРУ <span>↗</span></button><button id="menuSettings" class="quiet">Настроить арену <span>⚙</span></button><div class="menu-foot"><span>МЫШЬ / WASD / ДЖОЙСТИК</span><span>ОЧКИ ВИРТУАЛЬНЫЕ</span></div></section><div class="edition">LOCAL EDITION <span>01 / 03 ARENAS</span></div></div>
<div id="pause" class="overlay hidden"><section class="result-card"><div class="eyebrow">TAKE YOUR TIME</div><h2>Пауза</h2><button id="resume" class="primary">ПРОДОЛЖИТЬ</button></section></div>
<div id="result" class="overlay hidden"><section class="result-card"><div id="resultScore" class="result-number"></div><button id="restart" class="primary">НОВЫЙ РАУНД ↗</button><button id="toMenu" class="quiet">Главное меню</button></section></div>
<div id="admin" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle"><section class="admin"><header><div><div class="eyebrow">SERPENT / CONTROL ROOM</div><h2 id="adminTitle">Настройки арены<span>LIVE</span></h2></div><button id="closeAdmin" aria-label="Закрыть настройки">×</button></header><div class="admin-body"><nav id="tabs"></nav><div class="editor"><div class="preview-wrap"><canvas id="preview" aria-label="Живой объёмный предпросмотр скина и арены"></canvas><div class="preview-tag">LIVE PREVIEW <span>●</span></div></div><div id="panel"></div></div></div><footer><span id="saveStatus">Изменения применяются сразу</span><div><button id="reset">RESET</button><button id="export">EXPORT</button><label class="filebtn">IMPORT<input id="import" type="file" accept=".json,application/json"></label><button id="apply">APPLY</button><button id="save" class="primary">SAVE</button></div></footer></section></div>
</main><script src="src/config.js"></script><script src="src/core.js"></script><script src="src/renderer.js"></script><script src="src/admin.js"></script><script src="src/game.js"></script></body></html>
